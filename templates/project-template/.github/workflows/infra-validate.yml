name: CI - Infrastructure

on:
  push:
    paths:
      - 'infrastructure/**'
      - '.github/workflows/infra-validate.yml'
  pull_request:
    paths:
      - 'infrastructure/**'
      - '.github/workflows/infra-validate.yml'

jobs:
  validate-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate infrastructure definitions
        shell: bash
        run: |
          set -euo pipefail

          if [ -f scripts/validate-infra.sh ]; then
            chmod +x scripts/validate-infra.sh
            ./scripts/validate-infra.sh
          else
            echo "No scripts/validate-infra.sh found. Add project-specific infrastructure validation commands."
          fi
